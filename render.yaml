services:
  - type: web
    name: trinity-trading
    env: python
    autoDeploy: true
    branch: main
    buildCommand: |
      set -e
      pip install --upgrade pip
      pip install -r requirements.txt
      # Install Node 20 via direct download (sem nodeenv, menos overhead)
      NODE_VERSION=20.11.1
      NODE_DIR=/tmp/node-${NODE_VERSION}
      mkdir -p $NODE_DIR
      curl -fsSL https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz -o /tmp/node.tar.xz
      tar -xf /tmp/node.tar.xz -C $NODE_DIR --strip-components=1
      export PATH=$NODE_DIR/bin:$PATH
      node --version
      npm --version
      # Build frontend (Vite outputa direto em ../dashboard/static/app)
      cd frontend
      npm ci --prefer-offline --no-audit
      npm run build
      cd ..
      ls dashboard/static/app/
      echo "Frontend build complete."
    startCommand: python start.py
    healthCheckPath: /health
    envVars:
      - key: MEXC_API_KEY
        sync: false
      - key: MEXC_SECRET_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COINGLASS_API_KEY
        sync: false
      - key: CRYPTOQUANT_API_KEY
        sync: false
      - key: GLASSNODE_API_KEY
        sync: false
      - key: SYMBOL
        value: BTC/USDT:USDT
      - key: TIMEFRAME
        value: 15m
      - key: SCORE_THRESHOLD
        value: "65"
      - key: INST_SCORE_THRESHOLD
        value: "60"
      - key: INST_INTERVAL_MINUTES
        value: "60"
      - key: SUMMARY_INTERVAL_MINUTES
        value: "120"
      - key: SIGNAL_INTERVAL_MINUTES
        value: "240"
