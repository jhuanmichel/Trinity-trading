name: Keep Alive + Trigger Analysis

on:
  schedule:
    - cron: "*/55 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger análise institucional
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://trinity-trading.onrender.com/api/run-now")
          echo "Status: $STATUS"
          if [ "$STATUS" = "202" ]; then
            echo "✅ Análise iniciada"
          elif [ "$STATUS" = "409" ]; then
            echo "⏳ Análise já em andamento"
          else
            echo "⚠️ Resposta inesperada: $STATUS"
            exit 1
          fi
